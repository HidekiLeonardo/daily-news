spring.application.name=daily-news

spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_POSTGRES}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

api.key=${API_KEY}
api.max=3
api.country=br
api.language=pt
api.categorias=general,world,nation,business,technology,entertainment,sports,science,health
api.url=https://gnews.io/api/v4/top-headlines

cron.daily=0 0 5 * * *

robo.key=${ROBO_KEY}
robo.url=https://api.groq.com/openai/v1/chat/completions
robo.model=openai/gpt-oss-120b